<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<title>Sombras de Valdor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=DotGothic16&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{
  --bg:#07060d; --panel:#16122a; --panel2:#211a3d; --ink:#ece7ff; --muted:#9d93c9;
  --accent:#57d3e3; --accent-d:#1f7d8f; --amber:#f2b33d; --danger:#e5534b; --ok:#72d86a;
  --edge:#040308; --shadow:rgba(0,0,0,.55); --sel:#2d2456;
  --r-common:#c9c3e6; --r-rare:#57b6f2; --r-epic:#c07cf2; --r-leg:#f2b33d;
  color-scheme:dark;
}
#app.ui-light{
  --panel:#e4e9f0; --panel2:#cfd8e4; --ink:#191530; --muted:#4f5a76; --accent:#0f7f93; --accent-d:#87c6d3;
  --amber:#a8660c; --edge:#191530; --shadow:rgba(25,21,48,.35); --sel:#b8e3ea;
  --r-common:#4f5a76; --r-rare:#1667b0; --r-epic:#7a2fb5; --r-leg:#9c5b00;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);
  font-family:"VT323","DotGothic16","Noto Sans SC",ui-monospace,Menlo,monospace;color:var(--ink);font-size:20px;line-height:1.15}
#app.cjk{font-family:"DotGothic16","Noto Sans SC","VT323",sans-serif;font-size:17px;line-height:1.3}
#app.cjk .px,#app.cjk .tab,#app.cjk .panel h2,#app.cjk .panel h3,#app.cjk #title .menu .btn,#app.cjk #objective,#app.cjk .kbd{font-family:"DotGothic16","Noto Sans SC",monospace!important;letter-spacing:0}
#app.cjk .tab{font-size:12px}#app.cjk .panel h2{font-size:17px}#app.cjk .panel h3{font-size:14px}#app.cjk #title .menu .btn{font-size:14px}#app.cjk #objective{font-size:13px}#app.cjk .hud-line .px{font-size:12px}#app.cjk .btn{font-size:17px}
#frame{position:relative}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.px{font-family:"Press Start 2P",ui-monospace,monospace;letter-spacing:.02em}
button{font:inherit;color:inherit}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.hud-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.bars{display:grid;gap:3px;min-width:0}
.bar{width:clamp(90px,22vw,170px);height:10px;background:#0b0916;border:2px solid #040308;box-shadow:2px 2px 0 rgba(0,0,0,.5);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .15s steps(6)}
.bar.hp i{background:linear-gradient(#ff8a7a 0 30%,#e5534b 30% 100%)}
.bar.mp i{background:linear-gradient(#9ef0fa 0 30%,#57d3e3 30% 100%)}
.bar.xp{height:5px}.bar.xp i{background:#f2b33d}
.hud-line{font-size:17px;color:#ece7ff;text-shadow:1px 1px 0 #000,-1px 0 0 #000;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hud-line .px{font-size:9px}
.hud-right{text-align:right;display:grid;gap:3px;justify-items:end}
.clock{display:flex;gap:6px;align-items:center}
.clock canvas{width:22px;height:22px;image-rendering:pixelated}
#objective{align-self:center;font-size:9px;background:rgba(7,6,13,.72);border:2px solid #040308;padding:6px 10px;color:#fff;text-align:center;max-width:90%}
#objective:empty{display:none}
#spellbox{display:flex;gap:6px;align-items:center}
#spellbox .slot{width:26px;height:26px;border:2px solid #040308;background:rgba(22,18,42,.85);display:grid;place-items:center}
#spellbox .slot.on{border-color:var(--accent);box-shadow:0 0 0 1px #040308}
#spellbox img{width:18px;height:18px;image-rendering:pixelated}
#toasts{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;width:92%}
.toast{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--accent-d),4px 4px 0 var(--shadow);padding:6px 12px;font-size:18px;display:flex;gap:8px;align-items:center;animation:tin .25s steps(4)}
.toast img{width:20px;height:20px;image-rendering:pixelated}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#minimap{image-rendering:pixelated;border:2px solid #040308;background:#07060d;width:84px;height:60px}
/* screens */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.dim{background:rgba(5,4,10,.62)}
.panel{background:var(--panel);color:var(--ink);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--accent-d),6px 6px 0 var(--shadow);padding:14px;max-width:min(760px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
.panel h2{font-family:"Press Start 2P",monospace;font-size:13px;margin:0 0 12px;color:var(--accent);text-wrap:balance;letter-spacing:.04em}
.panel h3{font-family:"Press Start 2P",monospace;font-size:10px;margin:10px 0 8px;color:var(--amber);letter-spacing:.04em}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--edge);padding:7px 10px;cursor:pointer;font-size:20px;box-shadow:2px 2px 0 var(--shadow)}
.btn:hover,.btn:focus-visible{outline:none;background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent),2px 2px 0 var(--shadow)}
.btn:focus-visible::before,.btn:hover::before{content:"";width:0;height:0;border:5px solid transparent;border-left:6px solid var(--amber);margin-right:-2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{width:auto;font-size:18px;padding:4px 8px}
.btn img{width:20px;height:20px;image-rendering:pixelated}
.row img{width:20px;height:20px;image-rendering:pixelated}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stack{display:grid;gap:6px}
/* title */
#title .menu{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:grid;gap:6px;width:min(300px,80%)}
#title .menu .btn{justify-content:center;font-family:"Press Start 2P",monospace;font-size:10px;padding:10px;background:rgba(22,18,42,.88);color:#ece7ff}
#title .foot{position:absolute;bottom:6px;right:10px;font-size:15px;color:#9d93c9}
/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-family:"Press Start 2P",monospace;font-size:8px;padding:7px 8px;background:var(--panel2);border:2px solid var(--edge);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"],.tab:focus-visible{color:var(--ink);background:var(--sel);outline:none;box-shadow:inset 0 -3px 0 var(--accent)}
#pause .panel{width:min(760px,100%);height:min(560px,100%)}
/* items */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.it{position:relative;aspect-ratio:1;max-width:100%;background:var(--panel2);border:2px solid var(--edge);display:grid;place-items:center;cursor:pointer;padding:0}
.it img{width:28px;height:28px;image-rendering:pixelated}
.it .q{position:absolute;right:2px;bottom:0;font-size:15px;text-shadow:1px 1px 0 var(--edge)}
.it .lv{position:absolute;left:2px;top:0;font-size:14px;color:var(--amber)}
.it .fav{position:absolute;right:2px;top:0;font-size:13px;color:var(--amber)}
.it.eq{box-shadow:inset 0 0 0 2px var(--ok)}
.it:focus-visible,.it.sel{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.r-common{color:var(--r-common)}.r-rare{color:var(--r-rare)}.r-epic{color:var(--r-epic)}.r-leg{color:var(--r-leg)}
.statline{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--danger)}
.prog{height:10px;background:var(--panel2);border:2px solid var(--edge);display:flex;gap:2px;padding:1px}
.prog i{flex:1;background:transparent}.prog i.on{background:var(--amber)}
/* skills */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.branch h3{text-align:center}
.sk{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--edge);padding:5px;cursor:pointer;font-size:17px;width:100%}
.sk img{width:24px;height:24px;image-rendering:pixelated;filter:grayscale(1) brightness(.6)}
.sk.have{box-shadow:inset 0 0 0 2px var(--ok)}.sk.have img{filter:none}
.sk.can img{filter:none}
.sk:focus-visible,.sk:hover{outline:none;background:var(--sel)}
.sk small{display:block;color:var(--muted);font-size:14px}
@media (max-width:560px){.tree{grid-template-columns:1fr}}
/* slots */
.slot3{display:grid;gap:8px}
.saveslot{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.saveslot canvas{width:44px;height:44px;image-rendering:pixelated;background:#07060d;border:2px solid var(--edge)}
/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ac{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--edge);padding:6px;font-size:17px}
.ac img{width:28px;height:28px;image-rendering:pixelated}
.ac.lock{opacity:.5}.ac.lock img{filter:grayscale(1)}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#touch .pad,#touch .btns{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));pointer-events:auto}
#touch .pad{left:14px;width:132px;height:132px}
#touch .pad b{position:absolute;width:44px;height:44px;background:rgba(236,231,255,.13);border:2px solid rgba(236,231,255,.3)}
#touch .btns{right:14px;width:150px;height:140px}
#touch .tb{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(236,231,255,.13);border:2px solid rgba(236,231,255,.35);color:#fff;font-family:"Press Start 2P",monospace;font-size:10px;display:grid;place-items:center}
#touch .tb.on,#touch .pad b.on{background:rgba(87,211,227,.4)}
#touch .menu{position:absolute;top:8px;left:50%;transform:translateX(-50%);pointer-events:auto;width:64px;height:24px;font-size:8px;border-radius:0}
.kbd{font-family:"Press Start 2P",monospace;font-size:8px;border:2px solid var(--edge);background:var(--panel2);padding:2px 5px}
.range{width:100%;accent-color:var(--accent)}
select{font:inherit;background:var(--panel2);color:var(--ink);border:2px solid var(--edge);padding:3px}
.dialog{max-width:min(460px,100%)}
.chip{font-size:15px;padding:0 6px;border:2px solid var(--edge);background:var(--panel2)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app" class="ui-dark">
  <div id="frame">
    <canvas id="game" width="320" height="180" aria-label="Sombras de Valdor"></canvas>
    <div id="hud" hidden>
      <div class="hud-top">
        <div class="bars">
          <div class="hud-line"><span class="px" id="h-lv">NV 1</span><span id="h-gold"></span></div>
          <div class="bar hp"><i id="h-hp"></i></div>
          <div class="bar mp"><i id="h-mp"></i></div>
          <div class="bar xp"><i id="h-xp"></i></div>
        </div>
        <div id="objective" class="px"></div>
        <div class="hud-right">
          <div class="hud-line clock"><canvas id="h-clock" width="11" height="11"></canvas><span id="h-time"></span></div>
          <div class="hud-line" id="h-event"></div>
          <canvas id="minimap" width="84" height="60"></canvas>
          <div class="hud-line px" id="h-zone" style="font-size:8px"></div>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div id="spellbox"></div>
        <div class="hud-line" id="h-hint"></div>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="touch" hidden>
      <button class="tb menu" data-a="menu" aria-label="Menú">MENU</button>
      <div class="pad" aria-label="Cruceta">
        <b data-a="up" style="left:44px;top:0"></b><b data-a="down" style="left:44px;top:88px"></b>
        <b data-a="left" style="left:0;top:44px"></b><b data-a="right" style="left:88px;top:44px"></b>
      </div>
      <div class="btns">
        <div class="tb" data-a="attack" style="right:0;top:40px">A</div>
        <div class="tb" data-a="jump" style="right:62px;top:82px">B</div>
        <div class="tb" data-a="magic" style="right:62px;top:0">M</div>
        <div class="tb" data-a="dash" style="right:0;top:100px;width:40px;height:40px;font-size:7px">DSH</div>
        <div class="tb" data-a="chain" style="right:112px;top:40px;width:40px;height:40px;font-size:7px">CAD</div>
      </div>
    </div>
    <div id="title" class="screen" hidden>
      <div class="menu" id="title-menu"></div>
      <div class="foot">v2.1 · © 2026 Suery · <span id="cloud-state"></span></div>
    </div>
    <div id="pause" class="screen dim" hidden><div class="panel" role="dialog"><div class="tabs" role="tablist" id="ptabs"></div><div id="pbody"></div></div></div>
    <div id="overlay" class="screen dim" hidden></div>
  </div>
</div>
